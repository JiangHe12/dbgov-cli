name: CI

# PR-gated checks:
#   - gofmt is clean
#   - go vet is clean
#   - go build succeeds
#   - go test ./... passes
# Linux is required; macOS extends the matrix. Windows is kept in a separate
# job so platform-specific issues are visible without changing the Linux gate.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'integration/*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go-version }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['stable']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: gofmt
        shell: bash
        run: |
          fmt_out=$(gofmt -l main.go cmd internal)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt diff in:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1

      - name: Run race detector (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...

  lint:
    name: lint / ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  vuln-scan:
    name: vuln-scan / ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

  windows:
    name: windows-latest / Go stable
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1

  integration:
    # Real database integration suite. Excluded from PR gating because it starts
    # database containers and dbgov integration tests are env-gated by DSN.
    name: database integration / ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/integration/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Start MySQL
        run: docker compose -f docker-compose.integration.yml up -d

      - name: Wait for database readiness
        run: |
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.integration.yml exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -pdbgov-root --silent \
              && docker compose -f docker-compose.integration.yml exec -T postgres pg_isready -h 127.0.0.1 -U postgres -d test; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.integration.yml logs --tail 100 mysql
          docker compose -f docker-compose.integration.yml logs --tail 100 postgres
          exit 1

      - name: Run integration suite
        env:
          DBGOV_TEST_MYSQL_DSN: root:dbgov-root@tcp(127.0.0.1:3306)/test
          DBGOV_TEST_MYSQL_DATABASE: test
          DBGOV_TEST_POSTGRES_DSN: postgres://postgres:dbgov-postgres@127.0.0.1:5432/test?sslmode=disable
          DBGOV_TEST_POSTGRES_DATABASE: test
        run: go test ./... -count=1

      - name: Tear down databases
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v
