name: Integration

# Real-backend integration tests (//go:build integration) against live MySQL
# and PostgreSQL containers from docker-compose.integration.yml. Runs nightly,
# on manual dispatch, and as the reusable release gate. It stays separate from
# push/PR CI so a slow database boot does not block everyday commits.

on:
  workflow_call: {}
  schedule:
    - cron: '0 5 * * *'   # daily 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    name: real-DB integration (mysql + postgres)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'
          cache: true

      - name: Start databases
        run: docker compose -f docker-compose.integration.yml up -d --wait

      - name: Run integration suite
        env:
          DBGOV_TEST_REQUIRED: '1'
          DBGOV_TEST_MYSQL_DSN: root:dbgov-root@tcp(127.0.0.1:3306)/test
          DBGOV_TEST_MYSQL_DATABASE: test
          DBGOV_TEST_POSTGRES_DSN: postgres://postgres:dbgov-postgres@127.0.0.1:5432/test?sslmode=disable
          DBGOV_TEST_POSTGRES_DATABASE: test
        run: go test -tags=integration ./... -count=1

      - name: Tear down databases
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v
